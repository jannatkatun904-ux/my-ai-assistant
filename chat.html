<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04100f">
<title>Boss AI - চ্যাট</title>
<style>
  :root{--bg:#04100f;--teal:#19f0c8;--blue:#3aa0ff}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:radial-gradient(120% 70% at 70% 0%,#0a2a27 0%,var(--bg) 60%);color:#e8fffb;
       font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;display:flex;flex-direction:column;
       padding-top:env(safe-area-inset-top)}
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
  .btn{width:42px;height:42px;border-radius:14px;border:1.5px solid var(--teal);background:rgba(25,240,200,.12);
       display:grid;place-items:center;font-size:19px;cursor:pointer;color:#fff;flex:none}
  .btn.on{background:var(--teal);box-shadow:0 0 14px var(--teal)}
  .ava{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #a35bff;flex:none}
  .title{flex:1;min-width:0}
  .title b{display:block;font-size:17px;letter-spacing:1px}
  .title small{font-size:11px;color:var(--teal)}
  #msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:84%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5;
     white-space:pre-wrap;word-wrap:break-word}
  .u{align-self:flex-end;background:linear-gradient(135deg,#3296ff,#7a4bff);border-bottom-right-radius:4px}
  .a{align-self:flex-start;background:rgba(255,255,255,.08);border:1px solid rgba(25,240,200,.25);border-bottom-left-radius:4px}
  .e{align-self:center;background:rgba(255,50,80,.15);border:1px solid rgba(255,50,80,.5);font-size:13px}
  .dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--teal);
             animation:b 1s infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
  form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
       border-top:1px solid rgba(255,255,255,.08);align-items:flex-end}
  textarea{flex:1;resize:none;max-height:120px;border-radius:20px;border:1.5px solid rgba(25,240,200,.4);
           background:rgba(255,255,255,.06);color:#fff;padding:11px 15px;font:inherit;font-size:15px;outline:none}
  .send{background:var(--teal);color:#04100f;border-color:var(--teal)}
</style>
</head>
<body>

<header>
  <div class="btn" onclick="location.href='index.html'">←</div>
  <img class="ava" src="avatar.jpg" alt="">
  <div class="title"><b>BOSS AI</b><small id="st">অনলাইন</small></div>
  <div class="btn" id="spk" title="উত্তর শোনা">🔊</div>
  <div class="btn" id="cfg" title="সেটিংস">🔑</div>
  <div class="btn" id="clr" title="নতুন চ্যাট">🗑</div>
</header>

<div id="msgs"></div>

<form id="f">
  <div class="btn" id="mic">🎤</div>
  <textarea id="t" rows="1" placeholder="কিছু লিখুন বা মাইক চাপুন..."></textarea>
  <button class="btn send" type="submit">➤</button>
</form>

<script>
  // ====== সেটিংস ======
  const MODEL = 'gemini-flash-latest';
  const SYSTEM = 'তুমি BOSS AI, ব্যবহারকারীর ব্যক্তিগত বাংলা সহকারী। ব্যবহারকারী যে ভাষায় লেখে সেই ভাষায় উত্তর দাও, ডিফল্ট বাংলা। উত্তর ছোট, বন্ধুত্বপূর্ণ ও পরিষ্কার রাখো।';

  const $ = id => document.getElementById(id);
  const box = $('msgs'), ta = $('t');
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem('boss_hist') || '[]'); } catch(e){}
  let speak = localStorage.getItem('boss_speak') === '1';
  $('spk').classList.toggle('on', speak);

  function getKey(force){
    let k = localStorage.getItem('boss_gkey') || '';
    if (!k || force){
      k = (prompt('আপনার Gemini API Key দিন। এটা শুধু এই ফোনেই থাকবে:', k) || '').trim();
      if (k) localStorage.setItem('boss_gkey', k);
    }
    return k;
  }

  function add(cls, text){
    const d = document.createElement('div');
    d.className = 'm ' + cls; d.textContent = text;
    box.appendChild(d); box.scrollTop = box.scrollHeight; return d;
  }
  function save(){ localStorage.setItem('boss_hist', JSON.stringify(hist.slice(-40))); }
  function render(){
    box.innerHTML = '';
    if (!hist.length) add('a', 'হ্যালো! আমি BOSS AI, আপনার ব্যক্তিগত সহকারী। বলুন, আমি কী করতে পারি?');
    hist.forEach(m => add(m.role === 'user' ? 'u' : 'a', m.content));
  }

  function say(text){
    if (!speak || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'bn-BD';
    speechSynthesis.speak(u);
  }

  async function send(text){
    text = text.trim(); if (!text) return;
    const key = getKey(); if (!key){ add('e','Gemini API Key ছাড়া চ্যাট চলবে না। 🔑 চেপে কী দিন।'); return; }
    add('u', text); hist.push({role:'user', content:text}); ta.value=''; ta.style.height='auto';
    const wait = document.createElement('div');
    wait.className='m a dots'; wait.innerHTML='<span></span><span></span><span></span>';
    box.appendChild(wait); box.scrollTop = box.scrollHeight; $('st').textContent='ভাবছি...';
    try{
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + MODEL + ':generateContent',{
        method:'POST',
        headers:{'content-type':'application/json','x-goog-api-key':key},
        body:JSON.stringify({
          system_instruction:{parts:[{text:SYSTEM}]},
          contents:hist.slice(-20).map(m => ({role:m.role==='user'?'user':'model', parts:[{text:m.content}]}))
        })
      });
      const j = await r.json();
      if (!r.ok) throw new Error((j.error && j.error.message) || ('ত্রুটি ' + r.status));
      const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
      const out = parts.map(c => c.text || '').join('').trim() || '(খালি উত্তর)';
      wait.remove(); add('a', out); hist.push({role:'assistant', content:out}); save(); say(out);
    }catch(err){
      wait.remove(); hist.pop();
      add('e', 'সমস্যা: ' + err.message + (/key|auth/i.test(err.message) ? ' — 🔑 চেপে সঠিক কী দিন।' : ''));
    }
    $('st').textContent='অনলাইন';
  }

  // ====== ইভেন্ট ======
  $('f').addEventListener('submit', e => { e.preventDefault(); send(ta.value); });
  ta.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(ta.value); }});
  ta.addEventListener('input', () => { ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,120)+'px'; });
  $('cfg').onclick = () => getKey(true);
  $('clr').onclick = () => { if (confirm('চ্যাট মুছে নতুন শুরু করবেন?')){ hist=[]; save(); render(); } };
  $('spk').onclick = () => {
    speak = !speak; localStorage.setItem('boss_speak', speak?'1':'0');
    $('spk').classList.toggle('on', speak); if(!speak && window.speechSynthesis) speechSynthesis.cancel();
  };

  // ====== ভয়েস ইনপুট ======
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  function mic(){
    if (!SR){ add('e','এই ব্রাউজারে ভয়েস ইনপুট নেই। Chrome ব্যবহার করুন।'); return; }
    if (listening){ rec.stop(); return; }
    rec = new SR(); rec.lang='bn-BD'; rec.interimResults=false;
    rec.onstart = () => { listening=true; $('mic').classList.add('on'); $('st').textContent='শুনছি...'; };
    rec.onend = () => { listening=false; $('mic').classList.remove('on'); $('st').textContent='অনলাইন'; };
    rec.onerror = ev => add('e','মাইক সমস্যা: ' + ev.error);
    rec.onresult = ev => { const s = ev.results[0][0].transcript; speak = true; $('spk').classList.add('on'); send(s); };
    rec.start();
  }
  $('mic').onclick = mic;

  render();
  if (location.hash === '#voice') setTimeout(mic, 400);
</script>
</body>
</html>
