<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04100f">
<title>Boss AI - চ্যাট</title>
<style>
  :root{--bg:#04100f;--teal:#19f0c8;--blue:#3aa0ff}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:radial-gradient(120% 70% at 70% 0%,#0a2a27 0%,var(--bg) 60%);color:#e8fffb;
       font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;display:flex;flex-direction:column;
       padding-top:env(safe-area-inset-top)}
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
  .btn{width:42px;height:42px;border-radius:14px;border:1.5px solid var(--teal);background:rgba(25,240,200,.12);
       display:grid;place-items:center;font-size:19px;cursor:pointer;color:#fff;flex:none}
  .btn.on{background:var(--teal);box-shadow:0 0 14px var(--teal)}
  .ava{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #a35bff;flex:none}
  .title{flex:1;min-width:0}
  .title b{display:block;font-size:17px;letter-spacing:1px}
  .title small{font-size:11px;color:var(--teal)}
  #msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:84%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5;
     white-space:pre-wrap;word-wrap:break-word}
  .u{align-self:flex-end;background:linear-gradient(135deg,#3296ff,#7a4bff);border-bottom-right-radius:4px}
  .a{align-self:flex-start;background:rgba(255,255,255,.08);border:1px solid rgba(25,240,200,.25);border-bottom-left-radius:4px}
  .e{align-self:center;background:rgba(255,50,80,.15);border:1px solid rgba(255,50,80,.5);font-size:13px}
  .dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--teal);
             animation:b 1s infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
  form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
       border-top:1px solid rgba(255,255,255,.08);align-items:flex-end}
  textarea{flex:1;resize:none;max-height:120px;border-radius:20px;border:1.5px solid rgba(25,240,200,.4);
           background:rgba(255,255,255,.06);color:#fff;padding:11px 15px;font:inherit;font-size:15px;outline:none}
  .send{background:var(--teal);color:#04100f;border-color:var(--teal)}
  /* সেটিংস বক্স */
  #ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  #ov.show{display:flex}
  .box{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:#0a1f1d;border:1.5px solid var(--teal);
       border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
  .box h3{font-size:16px}
  .box label{font-size:13px;color:var(--teal)}
  .box textarea,.box input{width:100%;max-height:none;border-radius:12px;padding:10px 12px;font-size:14px;
       border:1.5px solid rgba(25,240,200,.4);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;outline:none}
  .box textarea{min-height:170px;resize:vertical}
  .row{display:flex;gap:8px;margin-top:4px}
  .row button{flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--teal);background:transparent;color:#fff;font:inherit;font-size:14px}
  .row .pri{background:var(--teal);color:#04100f;font-weight:700}
</style>
</head>
<body>

<header>
  <div class="btn" onclick="location.href='index.html'">←</div>
  <img class="ava" src="avatar.jpg" alt="">
  <div class="title"><b>BOSS AI</b><small id="st">অনলাইন</small></div>
  <div class="btn" id="spk" title="উত্তর শোনা">🔊</div>
  <div class="btn" id="cfg" title="সেটিংস">⚙️</div>
  <div class="btn" id="clr" title="নতুন চ্যাট">🗑</div>
</header>

<div id="msgs"></div>

<form id="f">
  <div class="btn" id="mic">🎤</div>
  <textarea id="t" rows="1" placeholder="কিছু লিখুন বা মাইক চাপুন..."></textarea>
  <button class="btn send" type="submit">➤</button>
</form>

<div id="ov">
  <div class="box">
    <h3>⚙️ সেটিংস</h3>
    <label>আমার নির্দেশনা (AI এই নিয়মেই কাজ করবে)</label>
    <textarea id="sysbox"></textarea>
    <label>Groq API Key (শুধু এই ফোনেই থাকবে)</label>
    <input id="keybox" type="password" placeholder="gsk_..." autocomplete="off">
    <div class="row">
      <button id="reset" type="button">ডিফল্ট</button>
      <button id="cancel" type="button">বাতিল</button>
      <button id="ok" type="button" class="pri">সেভ</button>
    </div>
  </div>
</div>

<script src="voice.js"></script>
<script>
  // ====== সেটিংস ======
  const MODEL = 'llama-3.3-70b-versatile';
  const API = 'https://api.groq.com/openai/v1/chat/completions';
  const DEFAULT_SYSTEM = 'তুমি BOSS AI, ব্যবহারকারীর ব্যক্তিগত বাংলা সহকারী। ব্যবহারকারী যে ভাষায় লেখে সেই ভাষায় উত্তর দাও, ডিফল্ট বাংলা। উত্তর ছোট, বন্ধুত্বপূর্ণ ও পরিষ্কার রাখো।';

  const $ = id => document.getElementById(id);
  const box = $('msgs'), ta = $('t');
  const clean = s => (s || '').replace(/[^\x21-\x7E]/g, '');
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem('boss_hist') || '[]'); } catch(e){}
  let speak = localStorage.getItem('boss_speak') === '1';
  $('spk').classList.toggle('on', speak);

  const getSys = () => localStorage.getItem('boss_sys') || DEFAULT_SYSTEM;
  const getKey = () => clean(localStorage.getItem('boss_groqkey'));

  function openCfg(){
    $('sysbox').value = getSys();
    $('keybox').value = getKey();
    $('ov').classList.add('show');
  }
  function closeCfg(){ $('ov').classList.remove('show'); }
  $('cfg').onclick = openCfg;
  $('cancel').onclick = closeCfg;
  $('reset').onclick = () => { $('sysbox').value = DEFAULT_SYSTEM; };
  $('ok').onclick = () => {
    const s = $('sysbox').value.trim();
    localStorage.setItem('boss_sys', s || DEFAULT_SYSTEM);
    const k = clean($('keybox').value);
    if (k) localStorage.setItem('boss_groqkey', k);
    closeCfg();
  };

  function add(cls, text){
    const d = document.createElement('div');
    d.className = 'm ' + cls; d.textContent = text;
    box.appendChild(d); box.scrollTop = box.scrollHeight; return d;
  }
  function save(){ localStorage.setItem('boss_hist', JSON.stringify(hist.slice(-40))); }
  function render(){
    box.innerHTML = '';
    if (!hist.length) add('a', 'হ্যালো! আমি BOSS AI, আপনার ব্যক্তিগত সহকারী। বলুন, আমি কী করতে পারি?');
    hist.forEach(m => add(m.role === 'user' ? 'u' : 'a', m.content));
  }

  function say(text){
    if (!speak) return;
    if (typeof bossSpeak === 'function'){ bossSpeak(text); return; }
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'bn-BD'; u.pitch = 1.25;
    speechSynthesis.speak(u);
  }

  async function send(text){
    text = text.trim(); if (!text) return;
    const key = getKey();
    if (!key){ add('e','Groq API Key নেই। ⚙️ চেপে কী দিন।'); openCfg(); return; }
    add('u', text); hist.push({role:'user', content:text}); ta.value=''; ta.style.height='auto';
    const wait = document.createElement('div');
    wait.className='m a dots'; wait.innerHTML='<span></span><span></span><span></span>';
    box.appendChild(wait); box.scrollTop = box.scrollHeight; $('st').textContent='ভাবছি...';
    let bubble = null, out = '';
    try{
      const r = await fetch(API,{
        method:'POST',
        headers:{'content-type':'application/json','authorization':'Bearer ' + key},
        body:JSON.stringify({
          model:MODEL, stream:true, max_tokens:800, temperature:0.7,
          messages:[{role:'system', content:getSys()}].concat(hist.slice(-12))
        })
      });
      if (!r.ok){
        const j = await r.json().catch(() => ({}));
        throw new Error((j.error && j.error.message) || ('ত্রুটি ' + r.status));
      }
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = '';
      while (true){
        const {done, value} = await reader.read(); if (done) break;
        buf += dec.decode(value, {stream:true});
        const lines = buf.split('\n'); buf = lines.pop();
        for (const ln of lines){
          if (!ln.startsWith('data:')) continue;
          const s = ln.slice(5).trim(); if (!s || s === '[DONE]') continue;
          try{
            const j = JSON.parse(s);
            const tx = (j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content) || '';
            if (tx){
              out += tx;
              if (!bubble){ wait.remove(); bubble = add('a', ''); $('st').textContent='লিখছি...'; }
              bubble.textContent = out; box.scrollTop = box.scrollHeight;
            }
          }catch(e){}
        }
      }
      out = out.trim();
      if (!out){ wait.remove(); out = '(খালি উত্তর)'; add('a', out); }
      hist.push({role:'assistant', content:out}); save(); say(out);
    }catch(err){
      wait.remove(); if (bubble) bubble.remove(); hist.pop();
      add('e', 'সমস্যা: ' + err.message + (/key|auth|invalid/i.test(err.message) ? ' — ⚙️ চেপে সঠিক কী দিন।' : ''));
    }
    $('st').textContent='অনলাইন';
  }

  // ====== ইভেন্ট ======
  $('f').addEventListener('submit', e => { e.preventDefault(); send(ta.value); });
  ta.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(ta.value); }});
  ta.addEventListener('input', () => { ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,120)+'px'; });
  $('clr').onclick = () => { if (confirm('চ্যাট মুছে নতুন শুরু করবেন?')){ hist=[]; save(); render(); } };
  $('spk').onclick = () => {
    speak = !speak; localStorage.setItem('boss_speak', speak?'1':'0');
    $('spk').classList.toggle('on', speak); if(!speak && window.speechSynthesis) speechSynthesis.cancel();
  };

  // ====== ভয়েস ইনপুট ======
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  function mic(){
    if (!SR){ add('e','এই ব্রাউজারে ভয়েস ইনপুট নেই। Chrome ব্যবহার করুন।'); return; }
    if (listening){ rec.stop(); return; }
    rec = new SR(); rec.lang='bn-BD'; rec.interimResults=false;
    rec.onstart = () => { listening=true; $('mic').classList.add('on'); $('st').textContent='শুনছি...'; };
    rec.onend = () => { listening=false; $('mic').classList.remove('on'); $('st').textContent='অনলাইন'; };
    rec.onerror = ev => add('e','মাইক সমস্যা: ' + ev.error);
    rec.onresult = ev => { const s = ev.results[0][0].transcript; speak = true; $('spk').classList.add('on'); send(s); };
    rec.start();
  }
  $('mic').onclick = mic;

  render();
  if (location.hash === '#voice') setTimeout(mic, 400);
</script>
</body>
</html>
