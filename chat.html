<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOSS AI</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0c1214;--panel:#13201f;--line:#1de9c6;--text:#e6f4f1;--mute:#7fa8a1;--me:#5b6cff;--err:#3a1519}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Bengali",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid #1b2c2a}
.ib{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:#0f1a19;color:var(--line);font-size:20px;cursor:pointer}
.ib.on{background:var(--line);color:#042}
header img{width:48px;height:48px;border-radius:50%;border:2px solid #9b5cff;object-fit:cover}
.who{flex:1;min-width:0}
.who b{font-size:18px;letter-spacing:1px}
.who small{display:block;color:var(--line);font-size:13px}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:12px 14px;border-radius:16px;line-height:1.6;font-size:16px;white-space:pre-wrap;word-wrap:break-word}
.bot{background:var(--panel);border:1px solid #1d3836;align-self:flex-start}
.me{background:linear-gradient(135deg,#3b82f6,var(--me));align-self:flex-end}
.err{background:var(--err);border:1px solid #7a2a31;align-self:center;font-size:14px}
pre{background:#071010;border:1px solid #1d3836;border-radius:10px;padding:10px;overflow-x:auto;margin:8px 0;white-space:pre;font-size:13px}
code{font-family:ui-monospace,monospace}
footer{display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid #1b2c2a}
#inp{flex:1;border:1.5px solid #1d5a52;border-radius:24px;background:#0f1a19;color:var(--text);padding:12px 16px;font-size:16px;outline:none;resize:none;max-height:120px;font-family:inherit}
#inp:focus{border-color:var(--line)}
#send{background:var(--line);color:#042;border:0;border-radius:14px;width:54px;font-size:22px;cursor:pointer}
#send:disabled{opacity:.5}
dialog{margin:auto;width:min(92vw,420px);background:#101b1a;color:var(--text);border:1.5px solid var(--line);border-radius:16px;padding:18px}
dialog::backdrop{background:#000a}
label{display:block;margin:12px 0 4px;font-size:14px;color:var(--mute)}
dialog input,dialog select{width:100%;padding:11px;border-radius:10px;border:1px solid #1d5a52;background:#0c1514;color:var(--text);font-size:15px}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:#0f1a19;color:var(--text);font-size:15px;cursor:pointer}
.row .pri{background:var(--line);color:#042}
</style>
</head>
<body>
<header>
  <button class="ib" onclick="location.href='home.html'" aria-label="ফিরে যান">←</button>
  <img src="avatar.jpg" alt="">
  <div class="who"><b>BOSS AI</b><small>অনলাইন</small></div>
  <button class="ib on" id="vbtn" aria-label="ভয়েস চালু/বন্ধ">🔊</button>
  <button class="ib" id="sbtn" aria-label="সেটিংস">⚙️</button>
  <button class="ib" id="cbtn" aria-label="চ্যাট মুছুন">🗑️</button>
</header>

<div id="chat"></div>

<footer>
  <button class="ib" id="mic" aria-label="মাইক">🎤</button>
  <textarea id="inp" rows="1" placeholder="কিছু লিখুন বা মাইক চাপুন..."></textarea>
  <button id="send" aria-label="পাঠান">➤</button>
</footer>

<dialog id="dlg">
  <b style="font-size:18px">সেটিংস</b>
  <label for="key">Groq API Key</label>
  <input id="key" type="password" placeholder="gsk_..." autocomplete="off">
  <label for="model">মডেল</label>
  <select id="model">
    <option value="openai/gpt-oss-120b">openai/gpt-oss-120b (সেরা)</option>
    <option value="openai/gpt-oss-20b">openai/gpt-oss-20b (দ্রুত)</option>
    <option value="qwen/qwen3.6-27b">qwen/qwen3.6-27b</option>
  </select>
  <div class="row">
    <button onclick="dlg.close()">বন্ধ করুন</button>
    <button class="pri" id="save">সেভ করুন</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), inp = $('inp'), dlg = $('dlg');
const SYSTEM = "তুমি BOSS AI, একজন বন্ধুসুলভ ও দক্ষ সহকারী। ব্যবহারকারী বাংলায় লিখলে সহজ বাংলায় উত্তর দাও। কোডিং প্রশ্নে পরিষ্কার ধাপ আর কোড ব্লক (```) দিয়ে উত্তর দাও। উত্তর সংক্ষিপ্ত রাখো।";
let history = JSON.parse(localStorage.getItem('boss_history') || '[]');
let voiceOn = localStorage.getItem('boss_voice') !== 'off';
let busy = false;

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(text){
  return esc(text).replace(/```(?:\w+)?\n?([\s\S]*?)```/g,(_,c)=>'<pre><code>'+c+'</code></pre>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}
function add(role, text){
  const d = document.createElement('div');
  d.className = 'm ' + role;
  if (role === 'bot') d.innerHTML = render(text); else d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function save(){localStorage.setItem('boss_history', JSON.stringify(history.slice(-30)))}

/* ---------- ভয়েস (মেয়েলি কণ্ঠ) ---------- */
let voices = [];
function loadVoices(){voices = speechSynthesis.getVoices()}
if ('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged = loadVoices}
function pickVoice(){
  const bn = voices.filter(v => /^bn/i.test(v.lang));
  const fem = /female|woman|girl|nabanita|tanishaa|priya|zira|samantha|google/i;
  return bn.find(v => fem.test(v.name)) || bn[0] || null;
}
function speak(text){
  if (!voiceOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const clean = text.replace(/```[\s\S]*?```/g,' কোড দেখুন। ').replace(/[*#`]/g,'');
  const u = new SpeechSynthesisUtterance(clean);
  const v = pickVoice();
  if (v){u.voice = v; u.lang = v.lang} else u.lang = 'bn-BD';
  u.pitch = 1.25; u.rate = 1;
  speechSynthesis.speak(u);
}
function paintVoice(){$('vbtn').classList.toggle('on', voiceOn); $('vbtn').textContent = voiceOn ? '🔊' : '🔇'}
$('vbtn').onclick = () => {
  voiceOn = !voiceOn;
  localStorage.setItem('boss_voice', voiceOn ? 'on' : 'off');
  if (!voiceOn) speechSynthesis.cancel();
  paintVoice();
};
paintVoice();

/* ---------- মাইক ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$('mic').onclick = () => {
  if (!SR) return add('err','এই ব্রাউজারে মাইক সাপোর্ট নেই। Chrome ব্যবহার করুন।');
  const r = new SR();
  r.lang = 'bn-BD';
  r.onstart = () => $('mic').classList.add('on');
  r.onend = () => $('mic').classList.remove('on');
  r.onresult = e => {inp.value = e.results[0][0].transcript; send()};
  r.onerror = e => add('err','মাইক সমস্যা: ' + e.error);
  r.start();
};

/* ---------- সেটিংস ---------- */
$('sbtn').onclick = () => {
  $('key').value = localStorage.getItem('boss_key') || '';
  $('model').value = localStorage.getItem('boss_model') || 'openai/gpt-oss-120b';
  dlg.showModal();
};
$('save').onclick = () => {
  localStorage.setItem('boss_key', $('key').value.trim());
  localStorage.setItem('boss_model', $('model').value);
  dlg.close();
};
$('cbtn').onclick = () => {
  if (!confirm('সব চ্যাট মুছে ফেলবেন?')) return;
  history = []; save(); chat.innerHTML = ''; speechSynthesis.cancel();
};

/* ---------- চ্যাট ---------- */
async function send(){
  const text = inp.value.trim();
  if (!text || busy) return;
  const key = localStorage.getItem('boss_key');
  if (!key){add('err','প্রথমে ⚙️ সেটিংসে গিয়ে Groq API Key দিন।'); return}
  const model = localStorage.getItem('boss_model') || 'openai/gpt-oss-120b';
  inp.value = ''; inp.style.height = 'auto';
  add('me', text);
  history.push({role:'user', content:text});
  busy = true; $('send').disabled = true;
  const wait = add('bot','...');
  try{
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model, messages:[{role:'system',content:SYSTEM}, ...history.slice(-20)], temperature:0.7})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || ('HTTP ' + res.status));
    const reply = data.choices[0].message.content || '';
    wait.innerHTML = render(reply);
    history.push({role:'assistant', content:reply});
    save(); speak(reply);
  }catch(e){
    wait.className = 'm err'; wait.textContent = 'সমস্যা: ' + e.message;
    history.pop();
  }
  busy = false; $('send').disabled = false;
  chat.scrollTop = chat.scrollHeight;
}
$('send').onclick = send;
inp.addEventListener('keydown', e => {if (e.key === 'Enter' && !e.shiftKey){e.preventDefault(); send()}});
inp.addEventListener('input', () => {inp.style.height = 'auto'; inp.style.height = inp.scrollHeight + 'px'});

history.forEach(m => add(m.role === 'user' ? 'me' : 'bot', m.content));
</script>
</body>
</html>
