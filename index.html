
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b24">
  <title>MY AI PRO</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #100b24; color: white;
      min-height: 100vh;
    }
    header {
      text-align: center; padding: 22px 12px;
      background: #211444; border-bottom: 1px solid #6544a8;
    }
    .avatar {
      width: 86px; height: 86px; margin: auto auto 10px;
      border-radius: 50%; display: grid; place-items: center;
      background: linear-gradient(135deg,#b15cff,#4225a7);
      font-size: 48px; box-shadow: 0 0 25px #914dff66;
    }
    h1 { margin: 8px 0; font-size: 25px; }
    header p { margin: 5px; color: #d0c2ff; font-size: 13px; }
    #chat {
      padding: 16px; height: 47vh; min-height: 230px;
      overflow-y: auto;
    }
    .msg {
      padding: 12px 14px; border-radius: 16px;
      margin: 10px 0; max-width: 88%;
      line-height: 1.5; white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .bot { background: #2b2048; border: 1px solid #49366e; }
    .user { background: #713ee5; margin-left: auto; }
    .controls { padding: 12px; }
    .inputrow { display: flex; gap: 8px; }
    input {
      min-width: 0; flex: 1; padding: 14px;
      border: 1px solid #60458e; border-radius: 14px;
      color: white; background: #211738; font-size: 16px;
    }
    button {
      border: 0; border-radius: 12px; padding: 12px;
      color: white; background: #7545e8; font-size: 15px;
    }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .tools button { flex: 1; min-width: 100px; background: #30204e; }
    #status { text-align: center; color: #c5b5f5; font-size: 12px; padding: 6px; }
  </style>
</head>
<body>
  <header>
    <div class="avatar">👩🏻‍💻</div>
    <h1>MY AI PRO</h1>
    <p>তোমার ব্যক্তিগত বাংলা AI Assistant</p>
  </header>

  <main id="chat" aria-live="polite">
    <div class="msg bot">আসসালামু আলাইকুম! আমি MY AI PRO। 😊
আমাকে বাংলায় লিখে বা মাইক্রোফোনে কথা বলে নির্দেশ দিতে পারো।</div>
  </main>

  <div id="status">Assistant প্রস্তুত</div>

  <section class="controls">
    <div class="inputrow">
      <input id="q" placeholder="এখানে বাংলায় লিখো..." autocomplete="off">
      <button id="send">পাঠাও</button>
    </div>
    <div class="tools">
      <button id="mic">🎙️ কথা বলো</button>
      <button id="speak">🔊 কণ্ঠ চালু</button>
      <button id="stop">⏹️ থামাও</button>
    </div>
  </section>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("q");
    const statusBox = document.getElementById("status");

    function addMessage(text, type) {
      const el = document.createElement("div");
      el.className = "msg " + type;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        statusBox.textContent = "এই ব্রাউজারে কণ্ঠ সুবিধা নেই।";
        return;
      }
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "bn-BD";
      utterance.rate = 0.92;
      const voices = speechSynthesis.getVoices();
      const female = voices.find(v =>
        /female|woman|zira|samantha/i.test(v.name) &&
        /^bn/i.test(v.lang)
      ) || voices.find(v => /^bn/i.test(v.lang));
      if (female) utterance.voice = female;
      speechSynthesis.speak(utterance);
    }

    function openApp(command) {
      const text = command.toLowerCase();

      if (text.includes("youtube")) {
        window.location.href = "https://www.youtube.com/";
        return "YouTube খোলার চেষ্টা করছি।";
      }
      if (text.includes("whatsapp")) {
        window.location.href = "https://www.whatsapp.com/";
        return "WhatsApp খোলার চেষ্টা করছি।";
      }
      if (text.includes("facebook")) {
        window.location.href = "https://www.facebook.com/";
        return "Facebook খোলার চেষ্টা করছি।";
      }
      if (text.includes("google")) {
        window.location.href = "https://www.google.com/";
        return "Google খোলার চেষ্টা করছি।";
      }
      return null;
    }

    function answer(text) {
      const cmd = text.toLowerCase();

      if (/সময়|সময়|time/.test(cmd)) {
        return "এখন তোমার ফোনের সময় " +
          new Date().toLocaleTimeString("bn-BD") + "।";
      }
      if (/তারিখ|date/.test(cmd)) {
        return "আজ " + new Date().toLocaleDateString("bn-BD") + "।";
      }
      if (/তোমার নাম|তুমি কে|তোমার পরিচয়/.test(cmd)) {
        return "আমি MY AI PRO, তোমার ব্যক্তিগত Assistant।";
      }
      if (/খবর|news/.test(cmd)) {
        return "সর্বশেষ খবর জানতে ইন্টারনেটের খবরের সাইট খুলতে পারো। লাইভ AI খবরের জন্য আলাদা Gemini API সংযোগ করতে হবে।";
      }
      if (/হ্যালো|হাই|আসসালামু/.test(cmd)) {
        return "ওয়ালাইকুম আসসালাম! বলো, কীভাবে সাহায্য করতে পারি?";
      }
      return "তোমার কথা বুঝেছি: “" + text +
        "”। আমি এখনো Gemini AI-এর সঙ্গে যুক্ত নই। সম্পূর্ণ AI উত্তর পেতে নিরাপদ API সংযোগ দরকার।";
    }

    function send() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";

      const opened = openApp(text);
      if (opened) {
        addMessage(opened, "bot");
        statusBox.textContent = "কমান্ড সম্পন্ন করার চেষ্টা চলছে";
        return;
      }

      const reply = answer(text);
      addMessage(reply, "bot");
      statusBox.textContent = "উত্তর দেওয়া হয়েছে";
      if (document.body.dataset.voice === "on") speak(reply);
    }

    document.getElementById("send").addEventListener("click", send);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") send();
    });

    document.getElementById("speak").addEventListener("click", () => {
      document.body.dataset.voice = "on";
      statusBox.textContent = "উত্তর শোনার সুবিধা চালু";
      speak("আমি MY AI PRO। কীভাবে সাহায্য করতে পারি?");
    });

    document.getElementById("stop").addEventListener("click", () => {
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      statusBox.textContent = "কণ্ঠ থামানো হয়েছে";
    });

    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    document.getElementById("mic").addEventListener("click", () => {
      if (!SpeechRecognition) {
        statusBox.textContent =
          "ভয়েস ইনপুট সমর্থিত নয়। Chrome-এ চেষ্টা করো।";
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = "bn-BD";
      recognition.interimResults = false;
      recognition.onstart = () => statusBox.textContent = "শুনছি...";
      recognition.onresult = e => {
        input.value = e.results[0][0].transcript;
        send();
      };
      recognition.onerror = () => statusBox.textContent =
        "মাইক্রোফোন কাজ করেনি। অনুমতি ও ইন্টারনেট পরীক্ষা করো।";
      recognition.start();
    });
  </script>
</body>
</html>
