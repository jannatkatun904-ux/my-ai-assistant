<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY AI PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.head{padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{width:46px;height:46px;background:linear-gradient(135deg,#a855f7,#6366f1);border-radius:50%;display:grid;place-items:center}
.title{font-weight:800;font-size:17px}.pro{background:#1a1a1a;border:1px solid #333;padding:3px 9px;border-radius:20px;font-size:10px;margin-left:6px}
.online{font-size:11px;color:#22c55e;display:flex;gap:5px;align-items:center;margin-top:2px}
.dot{width:7px;height:7px;background:#22c55e;border-radius:50%}
.greet{padding:12px 22px}.greet h1{font-size:32px;font-weight:900}.greet h1 span{color:#a855f7}.greet p{color:#777;font-size:14px;margin-top:6px}
.chat{flex:1;overflow-y:auto;padding:12px 20px;display:flex;flex-direction:column;gap:10px}
.bubble{padding:11px 15px;border-radius:18px;max-width:82%;font-size:14px}
.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:6px}
.ai{align-self:flex-start;background:#151515;border:1px solid #222}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#c084fc,#7c3aed 40%,#1e3a8a 80%);box-shadow:0 0 50px rgba(168,85,247,.4);margin:0 auto;animation:pulse 3s infinite;position:relative}
.orb::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:18px;height:18px;background:#fff;border-radius:50%}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.input{padding:10px 14px;border-top:1px solid #111;display:flex;gap:8px;background:#000}
input{flex:1;background:#111;border:1px solid #222;border-radius:24px;padding:13px 16px;color:#fff;outline:none}
button{background:#fff;color:#000;border:none;border-radius:24px;padding:13px 20px;font-weight:800}
</style>
</head>
<body>
<div style="padding:8px 20px;display:flex;justify-content:space-between;opacity:.6;font-size:13px"><span>9:41</span><span>📶 🔋</span></div>
<div class="head"><div style="display:flex;gap:12px;align-items:center"><div class="logo">✨</div><div><div class="title">MY AI <span class="pro">PRO</span></div><div class="online"><span class="dot"></span>Online • GPT-4o</div></div></div><div>👑</div></div>
<div class="greet"><h1>হ্যালো, <span>বস</span> 👋</h1><p>কি হেল্প লাগবে আজকে? আমি full ready.</p></div>
<div style="display:flex;justify-content:center;padding:10px 0"><div class="orb"></div></div>
<div class="chat" id="chat"><div class="bubble ai">হ্যালো! আমি তোমার PRO AI। নিচে লিখো, আমি চ্যাটেই রিপ্লাই দেবো 😎</div></div>
<div class="input"><input id="q" placeholder="কিছু লিখো..."><button onclick="send()">Send</button></div>
<script>
const chat=document.getElementById('chat');const input=document.getElementById('q');
function send(){let v=input.value.trim();if(!v)return;add(v,'user');input.value='';setTimeout(()=>{let r='';let vl=v.toLowerCase();if(vl.includes('কয়টা বাজে')||vl.includes('সময়')){r='এখন বাজে: '+new Date().toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'})+' ⏰';}else{r='"'+v+'" - পেয়েছি বস! 😎';}add(r,'ai');},500);}
function add(t,type){let d=document.createElement('div');d.className='bubble '+type;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
