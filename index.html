<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
.header{padding:20px;text-align:center;border-bottom:2px solid #fff;font-size:20px;font-weight:bold}
.line{height:2px;background:linear-gradient(90deg,black,white,black)}
.chat{padding:20px}
.msg{background:#222;padding:12px;border-radius:12px;margin:10px 0}
.input{position:fixed;bottom:0;left:0;right:0;padding:10px;background:#000;display:flex;gap:10px;border-top:1px solid #333}
input{flex:1;padding:12px;border-radius:20px;border:1px solid #333;background:#111;color:#fff}
button{padding:12px 20px;border-radius:20px;border:none;background:#fff;color:#000;font-weight:bold}
</style>
</head>
<body>
<div class="header">My AI - নিজের সহকারী</div>
<div class="line"></div>
<div class="chat" id="chat">
<div class="msg">হ্যালো! আমি তোমার AI সহকারী। কাজ করছে! 😊</div>
</div>
<div class="input">
<input id="t" placeholder="কিছু লিখো...">
<button onclick="send()">Send</button>
</div>
<script>
function send(){
let v=document.getElementById('t').value;
if(!v)return;
document.getElementById('chat').innerHTML+='<div class=msg>'+v+'</div>';
document.getElementById('t').value='';
setTimeout(()=>{document.getElementById('chat').innerHTML+='<div class=msg>✅ "'+v+'" - পেয়েছি! এপ কাজ করছে!</div>';},500);
}
</script>
</body>
</html>
