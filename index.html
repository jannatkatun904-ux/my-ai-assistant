
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090914">
<title>MY AI PRO — Assistant</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090914;color:white;font-family:Arial,sans-serif}
.app{max-width:500px;height:100dvh;min-height:500px;margin:auto;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,#302052,#090914 55%)}
header{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #332747}
header a{color:#d8b5ff;text-decoration:none}
.title{font-weight:bold;color:#d8b5ff;font-size:20px}
.status{font-size:12px;color:#94ffc2;margin-top:5px}
.avatar-area{text-align:center;padding:15px}
.avatar{font-size:57px;width:85px;height:85px;border-radius:50%;display:grid;place-items:center;margin:auto;background:linear-gradient(135deg,#a76aff,#35205d);border:2px solid #d9baff}
#messages{flex:1;overflow:auto;padding:12px}
.message{padding:12px 14px;margin-bottom:10px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.bot{background:#201832;border:1px solid #403056;margin-right:20px}
.user{background:#6737a9;margin-left:28px}
.quick{display:flex;gap:8px;padding:10px;overflow-x:auto}
.quick button{white-space:nowrap;padding:10px;border-radius:12px;border:1px solid #493565;background:#1c1630;color:white}
.input-area{display:flex;gap:8px;padding:12px;background:#100d1c;border-top:1px solid #332747}
input{min-width:0;flex:1;border:1px solid #574276;border-radius:24px;background:#201a32;color:white;padding:13px;font-size:15px}
button{cursor:pointer}
.send,.mic{width:46px;height:46px;border:0;border-radius:50%;color:white;background:#7846d8;font-size:18px}
.mic{background:#b82f72}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <div class="title">✦ MY AI PRO</div>
    <div id="status" class="status">● প্রস্তুত আছি</div>
  </div>
  <a href="home.html">⌂ হোম</a>
</header>

<section class="avatar-area">
  <div class="avatar">👩🏻</div>
</section>

<main id="messages" aria-live="polite">
  <div class="message bot">আসসালামু আলাইকুম! 😊 আমাকে বাংলায় লিখুন অথবা মাইক্রোফোনে কথা বলুন।</div>
</main>

<div class="quick">
  <button onclick="openSite('youtube')">▶ YouTube</button>
  <button onclick="openSite('whatsapp')">💬 WhatsApp</button>
  <button onclick="openSite('google')">🔎 Google</button>
</div>

<div class="input-area">
  <input id="userInput" placeholder="এখানে লিখুন..." autocomplete="off">
  <button class="mic" onclick="listen()">🎙️</button>
  <button class="send" onclick="send()">➤</button>
</div>
</div>

<script>
const messages=document.getElementById("messages");
const input=document.getElementById("userInput");
const statusText=document.getElementById("status");

function add(text,type){
  const d=document.createElement("div");
  d.className="message "+type;
  d.textContent=text;
  messages.appendChild(d);
  messages.scrollTop=messages.scrollHeight;
}

function speak(text){
  if(!("speechSynthesis" in window)){
    statusText.textContent="কণ্ঠ সমর্থিত নয়";
    return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="bn-BD";
  u.rate=0.9;
  u.pitch=1.08;
  const voices=speechSynthesis.getVoices();
  const v=voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith("bn"));
  if(v)u.voice=v;
  u.onstart=()=>statusText.textContent="● কথা বলছি...";
  u.onend=()=>statusText.textContent="● প্রস্তুত আছি";
  speechSynthesis.speak(u);
}

function openSite(name){
  const sites={
    youtube:"https://www.youtube.com/",
    whatsapp:"https://www.whatsapp.com/",
    google:"https://www.google.com/",
    facebook:"https://www.facebook.com/"
  };
  if(sites[name])window.open(sites[name],"_blank");
}

function reply(text){
  const q=text.toLowerCase();

  if(/সালাম|আসসালামু/.test(q))
    return "ওয়ালাইকুম আসসালাম! আপনাকে কীভাবে সাহায্য করব?";

  if(/তোমার নাম|তুমি কে|কে তুমি/.test(q))
    return "আমি MY AI PRO, আপনার বাংলা AI সহকারী।";

  if(/হ্যালো|হাই/.test(q))
    return "হ্যালো! 😊 বলুন, কী সাহায্য লাগবে?";

  if(/সময়|কয়টা বাজে/.test(q))
    return "এখন সময় "+new Date().toLocaleTimeString("bn-BD",{hour:"numeric",minute:"2-digit"});

  if(/তারিখ/.test(q))
    return "আজ "+new Date().toLocaleDateString("bn-BD",{year:"numeric",month:"long",day:"numeric"});

  if(/ইউটিউব|youtube/.test(q)){
    openSite("youtube");
    return "YouTube খোলার চেষ্টা করছি।";
  }

  if(/হোয়াটসঅ্যাপ|whatsapp/.test(q)){
    openSite("whatsapp");
    return "WhatsApp খোলার চেষ্টা করছি।";
  }

  if(/ফেসবুক|facebook/.test(q)){
    openSite("facebook");
    return "Facebook খোলার চেষ্টা করছি।";
  }

  if(/গুগল|google/.test(q)){
    openSite("google");
    return "Google খোলার চেষ্টা করছি।";
  }

  if(/খবর|নিউজ|news/.test(q))
    return "এই সংস্করণে সরাসরি নতুন খবর পড়ার ব্যবস্থা নেই। Google-এ খবর খুঁজে দেখতে পারেন।";

  if(/ধন্যবাদ/.test(q))
    return "আপনাকে স্বাগতম! 😊";

  return "আপনি বলেছেন: "+text+
    "\nএখনও আমার সাধারণ উত্তর দেওয়ার ক্ষমতা সীমিত। সব প্রশ্নের বুদ্ধিমান উত্তর দিতে নিরাপদ AI API সংযোগ করতে হবে।";
}

function send(){
  const text=input.value.trim();
  if(!text)return;
  add(text,"user");
  input.value="";
  const answer=reply(text);
  add(answer,"bot");
  speak(answer);
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter")send();
});

function listen(){
  const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Recognition){
    add("আপনার ব্রাউজারে ভয়েস ইনপুট পাওয়া যাচ্ছে না। Chrome-এ চেষ্টা করুন।","bot");
    return;
  }
  const r=new Recognition();
  r.lang="bn-BD";
  r.interimResults=false;
  r.onstart=()=>statusText.textContent="● আপনার কথা শুনছি...";
  r.onresult=e=>{
    input.value=e.results[0][0].transcript;
    send();
  };
  r.onerror=()=>statusText.textContent="মাইক্রোফোনে সমস্যা";
  r.onend=()=>statusText.textContent="● প্রস্তুত আছি";
  r.start();
}
</script>
</body>
</html>
