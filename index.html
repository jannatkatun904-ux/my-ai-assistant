
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090914">
  <title>My AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #090914;
      color: white;
    }

    .app {
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top, #30205d, #090914 48%);
    }

    header {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #30294b;
    }

    header h1 {
      margin: 0;
      color: #d7b8ff;
      font-size: 23px;
    }

    header p {
      margin: 7px 0 0;
      color: #aaa4c5;
      font-size: 13px;
    }

    .avatar-area {
      text-align: center;
      padding: 24px 12px 12px;
    }

    .avatar {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 85px;
      background: linear-gradient(135deg, #bd83ff, #4726a8);
      border: 4px solid #d8b5ff;
      box-shadow: 0 0 35px #8c49ff66;
    }

    .status {
      color: #8fffc1;
      margin-top: 12px;
      font-size: 13px;
    }

    #messages {
      flex: 1;
      min-height: 180px;
      max-height: 36vh;
      overflow-y: auto;
      padding: 14px;
    }

    .message {
      padding: 12px 14px;
      border-radius: 16px;
      margin-bottom: 10px;
      line-height: 1.65;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .bot {
      background: #211a38;
      border: 1px solid #443365;
      margin-right: 22px;
    }

    .user {
      background: #6036aa;
      margin-left: 35px;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      padding: 12px;
    }

    .quick-actions button {
      background: #171329;
      color: white;
      border: 1px solid #49366d;
      padding: 12px 6px;
      border-radius: 12px;
      font-size: 14px;
    }

    .input-area {
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #30294b;
      background: #0d0b19;
    }

    #userInput {
      min-width: 0;
      flex: 1;
      background: #201a32;
      border: 1px solid #59417e;
      color: white;
      padding: 13px;
      border-radius: 24px;
      font-size: 15px;
      outline: none;
    }

    .action-btn {
      border: none;
      border-radius: 50%;
      width: 46px;
      min-width: 46px;
      height: 46px;
      color: white;
      font-size: 19px;
      background: #7846d8;
    }

    .mic {
      background: #b82f72;
    }

    footer {
      color: #8e87a8;
      text-align: center;
      font-size: 11px;
      padding: 8px;
    }
  </style>
</head>

<body>
<div class="app">

  <header>
    <h1>MY AI ASSISTANT</h1>
    <p>আপনার ব্যক্তিগত বাংলা AI সহকারী</p>
  </header>

  <section class="avatar-area">
    <div class="avatar" aria-label="AI avatar">👩🏻</div>
    <div class="status" id="status">● প্রস্তুত আছি</div>
  </section>

  <main id="messages" aria-live="polite">
    <div class="message bot">
      আসসালামু আলাইকুম! 😊 আমি আপনার AI সহকারী।
      আমাকে বাংলায় লিখে অথবা মাইক্রোফোনে কথা বলে নির্দেশ দিন।
    </div>
  </main>

  <section class="quick-actions">
    <button onclick="openSite('youtube')">▶ YouTube খুলুন</button>
    <button onclick="openSite('whatsapp')">💬 WhatsApp খুলুন</button>
    <button onclick="openSite('facebook')">📘 Facebook খুলুন</button>
    <button onclick="openSite('google')">🔎 Google খুলুন</button>
  </section>

  <div class="input-area">
    <input id="userInput" type="text"
      placeholder="এখানে বাংলায় লিখুন..."
      autocomplete="off">

    <button class="action-btn mic"
      onclick="startListening()" title="কথা বলুন">🎙️</button>

    <button class="action-btn"
      onclick="sendMessage()" title="পাঠান">➤</button>
  </div>

  <footer>
    নারী কণ্ঠের প্রাপ্যতা আপনার ফোনের বাংলা Text-to-Speech ভয়েসের ওপর নির্ভর করে।
  </footer>

</div>

<script>
  const messages = document.getElementById("messages");
  const input = document.getElementById("userInput");
  const statusText = document.getElementById("status");

  function addMessage(text, type) {
    const item = document.createElement("div");
    item.className = "message " + type;
    item.textContent = text;
    messages.appendChild(item);
    messages.scrollTop = messages.scrollHeight;
  }

  // ফোনে থাকা বাংলা কণ্ঠ ব্যবহার করা হবে।
  // নারী কণ্ঠ পেতে ফোনের Text-to-Speech সেটিংসে উপযুক্ত ভয়েস নির্বাচন করুন।
  function speak(text) {
    if (!("speechSynthesis" in window)) {
      statusText.textContent = "এই ব্রাউজারে কণ্ঠ সমর্থিত নয়";
      return;
    }

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "bn-BD";
    speech.rate = 0.9;
    speech.pitch = 1.08;

    const voices = window.speechSynthesis.getVoices();
    const bengaliVoice = voices.find(v =>
      v.lang && v.lang.toLowerCase().startsWith("bn")
    );

    if (bengaliVoice) {
      speech.voice = bengaliVoice;
    }

    speech.onstart = () => {
      statusText.textContent = "● কথা বলছি...";
    };

    speech.onend = () => {
      statusText.textContent = "● প্রস্তুত আছি";
    };

    speech.onerror = () => {
      statusText.textContent = "কণ্ঠ চালু হয়নি";
    };

    window.speechSynthesis.speak(speech);
  }

  function openSite(name) {
    const sites = {
      youtube: "https://www.youtube.com/",
      whatsapp: "https://www.whatsapp.com/",
      facebook: "https://www.facebook.com/",
      google: "https://www.google.com/"
    };

    const labels = {
      youtube: "YouTube",
      whatsapp: "WhatsApp",
      facebook: "Facebook",
      google: "Google"
    };

    if (sites[name]) {
      addMessage(labels[name] + " খুলছি।", "bot");
      window.open(sites[name], "_blank");
    }
  }

  function getReply(text) {
    const q = text.toLowerCase().trim();

    if (/আসসালামু|সালাম/.test(q)) {
      return "ওয়ালাইকুম আসসালাম! 😊 আপনাকে কীভাবে সাহায্য করতে পারি?";
    }

    if (/হ্যালো|হাই|হ্যালো/.test(q)) {
      return "হ্যালো! আমি আপনার AI সহকারী। কী করতে চান বলুন।";
    }

    if (/তোমার নাম|কে তুমি|তুমি কে/.test(q)) {
      return "আমি আপনার My AI Assistant। আমি বাংলায় কথা বলতে এবং কিছু ওয়েবসাইট খুলতে সাহায্য করতে পারি।";
    }

    if (/সময়|কয়টা বাজে|কটা বাজে/.test(q)) {
      return "এখন আপনার ফোনের সময় " +
        new Date().toLocaleTimeString("bn-BD", {
          hour: "numeric",
          minute: "2-digit"
        });
    }

    if (/তারিখ|আজ কত তারিখ|আজকের তারিখ/.test(q)) {
      return "আজ " + new Date().toLocaleDateString("bn-BD", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }

    if (/ইউটিউব|youtube/.test(q)) {
      openSite("youtube");
      return "YouTube খোলার চেষ্টা করছি।";
    }

    if (/হোয়াটসঅ্যাপ|হোয়াটসঅ্যাপ|whatsapp/.test(q)) {
      openSite("whatsapp");
      return "WhatsApp খোলার চেষ্টা করছি।";
    }

    if (/ফেসবুক|facebook/.test(q)) {
      openSite("facebook");
      return "Facebook খোলার চেষ্টা করছি।";
    }

    if (/গুগল|google/.test(q)) {
      openSite("google");
      return "Google খোলার চেষ্টা করছি।";
    }

    if (/খবর|নিউজ|news|বিশ্বের খবর/.test(q)) {
      return "আমি এই সংস্করণে সরাসরি নতুন খবর পড়তে পারি না। বর্তমান খবর দেখতে Google খুলে অনুসন্ধান করুন।";
    }

    if (/ধন্যবাদ/.test(q)) {
      return "আপনাকে স্বাগতম! 😊 আর কী সাহায্য করতে পারি?";
    }

    return "আপনার কথা বুঝেছি: " + text +
      "\nএই সংস্করণে আমার উত্তর সীমিত। সাধারণ প্রশ্নের বুদ্ধিমান উত্তর দিতে একটি নিরাপদ AI API সংযোগ করতে হবে।";
  }

  function sendMessage() {
    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    const reply = getReply(text);
    addMessage(reply, "bot");
    speak(reply);
  }

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });

  function startListening() {
    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      addMessage(
        "আপনার ব্রাউজারে বাংলা ভয়েস ইনপুট সমর্থিত নয়। Android-এর Chrome ব্যবহার করে চেষ্টা করুন।",
        "bot"
      );
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "bn-BD";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      statusText.textContent = "● আপনার কথা শুনছি...";
    };

    recognition.onresult = (event) => {
      input.value = event.results[0][0].transcript;
      sendMessage();
    };

    recognition.onerror = () => {
      statusText.textContent = "মাইক্রোফোনে সমস্যা হয়েছে";
    };

    recognition.onend = () => {
      statusText.textContent = "● প্রস্তুত আছি";
    };

    recognition.start();
  }

  if ("speechSynthesis" in window) {
    window.speechSynthesis.getVoices();
  }
</script>
</body>
</html>
