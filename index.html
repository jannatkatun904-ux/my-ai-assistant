<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04100f">
<link rel="manifest" href="manifest.json">
<title>Boss AI - হোম</title>
<style>
  :root{
    --bg:#04100f; --teal:#19f0c8; --amber:#ffb23e;
    --silver:#cfd8dc; --blue:#3aa0ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 70% at 70% 35%, #0a2a27 0%, var(--bg) 60%);
    color:#e8fffb; font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    padding-top:env(safe-area-inset-top);
  }
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
  .sq{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--teal);
      background:rgba(25,240,200,.12);display:grid;place-items:center;font-size:20px;
      box-shadow:0 0 14px rgba(25,240,200,.35);cursor:pointer}
  .round{border-radius:50%}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:50%;
        background:conic-gradient(from 0deg,#19f0c8,#3aa0ff,#a35bff,#19f0c8);
        display:grid;place-items:center;animation:spin 6s linear infinite}
  .logo::after{content:"";width:22px;height:22px;border-radius:50%;background:var(--bg)}
  .brand h1{font-size:19px;letter-spacing:2px;font-weight:800}
  .brand small{display:block;font-size:10px;color:var(--teal);opacity:.8;letter-spacing:1px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .stage{flex:1;position:relative;min-height:0}
  .hero{position:absolute;right:-6%;top:50%;transform:translateY(-52%);
        width:74%;aspect-ratio:1;max-height:100%;border-radius:24px;
        box-shadow:-18px 0 50px rgba(255,50,80,.35),18px 0 50px rgba(50,150,255,.35)}
  .hero .ring{position:absolute;inset:0;border-radius:24px;
        background:conic-gradient(from 0deg,#ff3250,#3296ff,#ff3250);animation:spin 8s linear infinite}
  .hero img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);border-radius:20px;object-fit:cover}
  .menu{position:absolute;left:14px;top:50%;transform:translateY(-55%);
        display:flex;flex-direction:column;gap:16px;z-index:2}
  .pill{display:flex;align-items:center;gap:10px;min-width:150px;padding:11px 16px 11px 12px;
        border-radius:30px;border:2px solid var(--c);color:#fff;font-weight:800;font-size:14px;
        letter-spacing:1px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);
        box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 10px color-mix(in srgb,var(--c) 18%,transparent);
        cursor:pointer;transition:transform .15s}
  .pill:active{transform:scale(.95)}
  .pill i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
          background:color-mix(in srgb,var(--c) 30%,#000);font-size:14px}

  .info{display:flex;gap:12px;padding:0 14px 12px;align-items:stretch}
  .brief{flex:1;font-size:12px;min-width:0}
  .brief h3{font-size:11px;letter-spacing:1.5px;margin-bottom:8px;color:#fff}
  .brief p{border-left:3px solid var(--blue);padding-left:8px;margin-bottom:6px;color:#d6f5ef;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brief a{color:var(--teal);font-weight:700;font-size:11px}
  .log{width:46%;border:1.5px solid rgba(25,240,200,.5);border-radius:16px;padding:10px 12px;
       background:rgba(25,240,200,.07);box-shadow:0 0 14px rgba(25,240,200,.2)}
  .log .top{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:1px}
  .log .top span{color:var(--teal)}
  .bar{height:5px;border-radius:5px;background:rgba(255,255,255,.12);margin:8px 0;overflow:hidden}
  .bar b{display:block;height:100%;width:30%;background:var(--teal);border-radius:5px;animation:load 3s ease-in-out infinite}
  @keyframes load{0%{width:15%}50%{width:90%}100%{width:15%}}
  .log p{font-size:11px;color:#d6f5ef}
  .log p::before{content:"● ";color:var(--teal)}

  nav{display:flex;justify-content:space-around;margin:0 12px calc(10px + env(safe-area-inset-bottom));
      padding:10px 6px;border-radius:26px;background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px)}
  nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#9fb8b3;
        text-decoration:none;font-weight:600}
  nav a span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px}
  nav a.on{color:#fff}
  nav a.on span{background:var(--teal);box-shadow:0 0 16px var(--teal)}
</style>
</head>
<body>

<header>
  <div class="sq round" onclick="location.href='index.html'">🕒</div>
  <div class="brand">
    <div class="logo"></div>
    <div><h1>BOSS AI</h1><small>আপনার ব্যক্তিগত সহকারী</small></div>
  </div>
  <div class="sq" onclick="location.href='profile.html'">🧠</div>
</header>

<div class="stage">
  <div class="menu">
    <div class="pill" style="--c:#3aa0ff" onclick="go('memory')"><i>◎</i>মেমোরি</div>
    <div class="pill" style="--c:#ffb23e" onclick="go('chat')"><i>💬</i>চ্যাট</div>
    <div class="pill" style="--c:#cfd8dc" onclick="go('soul')"><i>☺</i>সোল</div>
    <div class="pill" style="--c:#19f0c8" onclick="go('settings')"><i>⚙</i>সেটিংস</div>
  </div>
  <div class="hero">
    <div class="ring"></div>
    <img src="avatar.jpg" alt="Boss AI">
  </div>
</div>

<div class="info">
  <div class="brief">
    <h3>ইন্টেলিজেন্স ব্রিফ</h3>
    <p>আজকের সারাংশ এখানে দেখা যাবে</p>
    <p>নতুন খবর ও রিমাইন্ডার</p>
    <a href="#">+৭ আরও</a>
  </div>
  <div class="log">
    <div class="top">সিস্টেম লগ <span>চলছে</span></div>
    <div class="bar"><b></b></div>
    <p id="logtxt">ভয়েস ইঞ্জিন প্রস্তুত</p>
  </div>
</div>

<nav>
  <a class="on" href="index.html"><span>🏠</span>হোম</a>
  <a href="index.html"><span>💬</span>চ্যাট</a>
  <a href="index.html#voice"><span>🎤</span>ভয়েস</a>
  <a href="index.html#history"><span>🕒</span>ইতিহাস</a>
  <a href="profile.html"><span>⚙️</span>সেটিংস</a>
</nav>

<script>
  function go(x){
    const m={chat:'index.html',memory:'index.html#memory',soul:'profile.html',settings:'profile.html'};
    location.href=m[x];
  }
  const msgs=['ভয়েস ইঞ্জিন প্রস্তুত','মেমোরি লোড হয়েছে','নেটওয়ার্ক সংযুক্ত','সবকিছু ঠিক আছে'];
  let k=0;setInterval(()=>{k=(k+1)%msgs.length;document.getElementById('logtxt').textContent=msgs[k]},2800);
</script>
</body>
</html>
