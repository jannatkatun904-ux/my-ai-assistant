<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY AI PRO</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.head{padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #a855f7}
.title{font-weight:800}.pro{background:#1a1a1a;border:1px solid #333;padding:3px 9px;border-radius:20px;font-size:10px;margin-left:6px}
.greet{padding:12px 22px}.greet h1{font-size:32px;font-weight:900}.greet h1 span{color:#a855f7}
.chat{flex:1;overflow-y:auto;padding:12px 20px;display:flex;flex-direction:column;gap:10px}
.bubble{padding:11px 15px;border-radius:18px;max-width:82%;font-size:14px}
.user{align-self:flex-end;background:#fff;color:#000}
.ai{align-self:flex-start;background:#151515;border:1px solid #222}
.avatar{width:160px;height:160px;border-radius:50%;object-fit:cover;border:3px solid #a855f7;box-shadow:0 0 40px rgba(168,85,247,.6);display:block;margin:10px auto;animation:pulse 3s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.line{height:2px;width:70%;margin:15px auto;background:linear-gradient(90deg,transparent,#a855f7,transparent);box-shadow:0 0 15px #a855f7;border-radius:10px}
.input{padding:10px 14px;border-top:1px solid #111;display:flex;gap:8px;background:#000}
input{flex:1;background:#111;border:1px solid #222;border-radius:24px;padding:13px 16px;color:#fff;outline:none}
button{background:#fff;color:#000;border:none;border-radius:24px;padding:13px 20px;font-weight:800}
</style>
</head>
<body>
<div class="head">
<div style="display:flex;gap:12px;align-items:center"><img src="avatar.jpg" class="logo"><div><div class="title">MY AI <span class="pro">PRO</span></div><div style="font-size:11px;color:#22c55e">● Avatar Mode</div></div></div><div>👑</div>
</div>
<div class="greet"><h1>হ্যালো, <span>বস</span> 👋</h1><p>নতুন avatar রেডি!</p></div>
<img src="avatar.jpg" class="avatar">
<div class="line"></div>
<div class="chat" id="chat"><div class="bubble ai">হ্যালো! নতুন লুকে কেমন লাগছে? 😍</div></div>
<div class="input"><input id="q" placeholder="কিছু লিখো..."><button onclick="send()">Send</button></div>
<script>
const chat=document.getElementById('chat');const input=document.getElementById('q');
function send(){let v=input.value.trim();if(!v)return;let d=document.createElement('div');d.className='bubble user';d.textContent=v;chat.appendChild(d);input.value='';setTimeout(()=>{let a=document.createElement('div');a.className='bubble ai';a.textContent='"'+v+'" - পেয়েছি বস!';chat.appendChild(a);chat.scrollTop=9999},500);chat.scrollTop=9999;}
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
