
<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY AI PRO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;
height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{padding:8px 18px;font-size:12px;opacity:.6}
.head{padding:12px 18px;display:flex;justify-content:space-between;
align-items:center;border-bottom:1px solid #222}
.logo{width:45px;height:45px;border-radius:50%;object-fit:cover;border:2px solid #a855f7}
.title{font-weight:800;font-size:17px}
.online{font-size:11px;color:#22c55e}
.greet{padding:12px 20px 5px}
.greet h1{font-size:27px;margin:0}
.greet span{color:#a855f7}
.avatar{width:125px;height:125px;object-fit:cover;border-radius:50%;
border:3px solid #a855f7;box-shadow:0 0 30px #7e22ce;
display:block;margin:8px auto;animation:pulse 3s infinite}
@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 45px #a855f7}}
.line{height:2px;width:65%;margin:5px auto 12px;
background:linear-gradient(90deg,transparent,#a855f7,transparent)}
.chat{flex:1;min-height:0;overflow-y:auto;padding:12px 16px;
display:flex;flex-direction:column;gap:10px}
.bubble{padding:11px 14px;border-radius:17px;max-width:88%;
font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.user{align-self:flex-end;background:#fff;color:#000}
.ai{align-self:flex-start;background:#171717;border:1px solid #333}
.input{padding:10px;display:flex;gap:7px;border-top:1px solid #222}
input{min-width:0;flex:1;background:#171717;color:white;border:1px solid #333;
border-radius:25px;padding:12px;font-size:15px;outline:none}
button{border:0;border-radius:25px;padding:12px 15px;font-weight:bold;cursor:pointer}
.send{background:#a855f7;color:white}
.mic{background:#222;color:white;border:1px solid #a855f7;font-size:18px}
.status{text-align:center;font-size:11px;color:#aaa;padding:3px}
</style>
</head>
<body>
<div class="top">MY AI PRO • ANDROID ASSISTANT</div>

<div class="head">
  <div style="display:flex;gap:10px;align-items:center">
    <img src="avatar.jpg" class="logo" alt="AI avatar">
    <div>
      <div class="title">MY AI PRO</div>
      <div class="online">● বাংলা সহকারী</div>
    </div>
  </div>
  <a href="profile.html" style="color:white;text-decoration:none">👑</a>
</div>

<div class="greet">
  <h1>হ্যালো, <span>বস</span> 👋</h1>
  <p style="font-size:13px">আমি আপনার বাংলা ভয়েস সহকারী।</p>
</div>

<img src="avatar.jpg" class="avatar" alt="রোবট সহকারী">
<div class="line"></div>
<div class="status" id="status">কথা বলতে 🎤 চাপুন</div>

<div class="chat" id="chat">
  <div class="bubble ai">হ্যালো বস! 😊 আমাকে বাংলায় কিছু বলুন।</div>
</div>

<div class="input">
  <button class="mic" id="mic" onclick="listen()" aria-label="কথা বলুন">🎤</button>
  <input id="q" placeholder="এখানে লিখুন..." autocomplete="off">
  <button class="send" onclick="send()">➤</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('q');
const statusText = document.getElementById('status');

function add(text,type){
  const d=document.createElement('div');
  d.className='bubble '+type;
  d.textContent=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

function speak(text){
  if(!('speechSynthesis' in window)){
    statusText.textContent='এই ব্রাউজারে কণ্ঠস্বর সমর্থিত নয়';
    return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='bn-BD';
  u.rate=0.92;
  u.pitch=1.18;

  const voices=speechSynthesis.getVoices();
  const voice=voices.find(v=>v.lang.toLowerCase().startsWith('bn'));
  if(voice)u.voice=voice;

  u.onstart=()=>statusText.textContent='🔊 উত্তর দিচ্ছি...';
  u.onend=()=>statusText.textContent='কথা বলতে 🎤 চাপুন';
  u.onerror=()=>statusText.textContent='ভয়েস চালু হয়নি';
  speechSynthesis.speak(u);
}

function answer(v){
  const s=v.toLowerCase();

  if(s.includes('হ্যালো')||s.includes('হাই'))
    return 'হ্যালো বস! আমি আপনার বাংলা AI সহকারী। কী করতে পারি?';

  if(s.includes('তোমার নাম')||s.includes('নাম কী'))
    return 'আমার নাম মাই এ আই প্রো। আমি আপনার ডিজিটাল সহকারী।';

  if(s.includes('কয়টা বাজে')||s.includes('সময়')||s.includes('সময়'))
    return 'এখন সময় '+new Date().toLocaleTimeString('bn-BD',
      {hour:'numeric',minute:'2-digit'})+'।';

  if(s.includes('তারিখ'))
    return 'আজ '+new Date().toLocaleDateString('bn-BD',
      {year:'numeric',month:'long',day:'numeric'})+'।';

  if(s.includes('কেমন আছ'))
    return 'আমি ভালো আছি বস! আপনার সঙ্গে কথা বলতে প্রস্তুত।';

  if(s.includes('বন্ধ কর')||s.includes('চুপ কর'))
    return 'ঠিক আছে বস।';

  return 'বস, আপনার কথা শুনেছি: '+v+
    '। তবে আমার পূর্ণ AI ব্রেইন এখনো সংযুক্ত হয়নি।';
}

function send(){
  const v=input.value.trim();
  if(!v)return;
  add(v,'user');
  input.value='';
  const r=answer(v);
  add(r,'ai');
  speak(r);
}

input.addEventListener('keydown',e=>{
  if(e.key==='Enter')send();
});

function listen(){
  const API=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!API){
    statusText.textContent='ভয়েস ইনপুট সমর্থিত নয়। আপডেটেড Chrome-এ চেষ্টা করুন।';
    add('আপনার ব্রাউজারে কথা শোনার সুবিধা পাওয়া যাচ্ছে না। লিখে কথা বলতে পারেন।','ai');
    return;
  }

  try{
    const rec=new API();
    rec.lang='bn-BD';
    rec.continuous=false;
    rec.interimResults=false;

    rec.onstart=()=>{
      statusText.textContent='🎤 শুনছি বস, বলুন...';
      document.getElementById('mic').textContent='🔴';
    };

    rec.onresult=e=>{
      input.value=e.results[0][0].transcript;
      send();
    };

    rec.onerror=e=>{
      statusText.textContent=e.error==='not-allowed'
        ?'মাইক্রোফোন অনুমতি দিন'
        :'কথা শোনা যায়নি, আবার চেষ্টা করুন';
      document.getElementById('mic').textContent='🎤';
    };

    rec.onend=()=>{
      document.getElementById('mic').textContent='🎤';
    };

    rec.start();
  }catch(e){
    statusText.textContent='আবার মাইক্রোফোন চাপুন';
  }
}
</script>
</body>
</html>
